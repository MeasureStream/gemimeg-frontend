<div class="row">
  <div class="col-xs-12">
    <h2 class="text">Bitte klicken, um Datei hochzuladen:</h2>
    <div
        (click)="fileInput.click()"
        (onFileDropped)="onUploadFile($event)"
        appDragDrop
        class="uploadfilecontainer">
      <input
          #fileInput
          (change)="onUploadFile($event)"
          style="display: none"
          type="file"/>
    </div>
  </div>
</div>
<div *ngIf="selectedFile" class="row">
  <div class="col-xs-12 selected-file">
    <h3>Ausgewählte Datei: {{ selectedFile.name }}</h3>
  </div>
</div>
<div *ngIf="selectedFile" class="button-container">
  <button (click)="uploadFile()" color="primary" mat-raised-button>Datei hochladen</button>
  <button (click)="onFileDownload()" color="primary" mat-raised-button>Datei herunterladen</button>
</div>
<div class="row">
  <div class="col-xs-12">
    <div *ngIf="backendResponse" class="selected-file">
      <h3>Gesiegelte Datei: {{ backendResponse.body.fileName }}</h3>
    </div>
  </div>
</div>
