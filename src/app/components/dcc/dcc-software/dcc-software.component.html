<mat-card *ngFor="let software of list; let i = index" class="blue-card">
  <mat-card-header>
    <div class="header-title">
      <mat-card-title class="title">Verwendete Software {{i+1}}</mat-card-title>
    </div>
    <div class="header-menu">
      <button (click)="toggleCard(i)" class="blue-card-btn" mat-icon-button>
        <mat-icon>
          <i class="material-icons">{{isExpanded[i]?'keyboard_arrow_up':'keyboard_arrow_down'}}</i></mat-icon>
      </button>
    </div>
  </mat-card-header>
  <mat-card-content *ngIf="isExpanded[i]">
    <p>
      <app-dcc-localised-string [isRequired]="true" [placeholder]="'Name'"
                                [strings]="software.name!"></app-dcc-localised-string>
      <mat-form-field>
        <mat-label>Version</mat-label>
        <input [(ngModel)]=software.version matInput name="version" required>
      </mat-form-field>
    </p>
    <button (click)="list.splice(i, 1);isExpanded.splice(i,1)" mat-icon-button>
      <mat-icon>remove</mat-icon>
    </button>
  </mat-card-content>
</mat-card>
<button (click)="list.push(getEmptySoftwareDto());addExpanded()" color="accent" mat-icon-button>
  <mat-icon>add</mat-icon>
</button>
