<mat-card *ngFor="let software of list; let i = index" class="blue-card">
  <mat-card-header>
    <div class="header-title">
      <mat-card-title class="title">{{'dcc.usedSoftware' | translate}} {{i+1}}</mat-card-title>
      <app-info-button tooltipText="{{'dcc.openDccWiki' | translate}}"
                       url="https://wiki.dcc.ptb.de/en/dccdccSoftware"></app-info-button>
    </div>
    <div class="header-menu">
      <button (click)="toggleCard(i)" class="blue-card-btn" mat-icon-button>
        <mat-icon>
          <i class="material-icons">{{ isExpanded[i] ? "keyboard_arrow_up" : "keyboard_arrow_down" }}</i></mat-icon>
      </button>
    </div>
  </mat-card-header>
  <mat-card-content *ngIf="isExpanded[i]">
    <app-dcc-localised-string [isRequired]="true" [placeholder]="'dcc.name' | translate"
                              [strings]="software.name!"></app-dcc-localised-string>
    <mat-form-field>
      <mat-label>{{'dcc.software.version' | translate}}</mat-label>
      <input [(ngModel)]=software.version matInput name="version" required>
    </mat-form-field>
    <button class="custom-circle-button-md" (click)="list.splice(i, 1);isExpanded.splice(i,1)" color="accent"
            mat-icon-button>
      <mat-icon>remove_circle</mat-icon>
    </button>
  </mat-card-content>
</mat-card>
<button class="custom-circle-button-md" (click)=" list.push(getEmptySoftwareDto());addExpanded()" color="primary"
        mat-icon-button>
  <mat-icon>add_circle</mat-icon>
</button>
