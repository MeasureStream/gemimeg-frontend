<mat-card *ngFor="let item of list; let i = index" class="blue-card">
  <mat-card-header>
    <div class="header-title">
      <mat-card-title class="title">{{'dcc.usedMethod' | translate}} {{i+1}}</mat-card-title>
      <app-info-button tooltipText="{{'dcc.openDccWiki' | translate}}"
                       url="https://wiki.dcc.ptb.de/en/dccusedMethodType"></app-info-button>
    </div>
    <div class="header-menu">
      <button (click)="toggleCard(i)" class="blue-card-btn" mat-icon-button>
        <mat-icon>
          <i class="material-icons">{{isExpanded[i]?'keyboard_arrow_up':'keyboard_arrow_down'}}</i></mat-icon>
      </button>
    </div>
  </mat-card-header>
  <mat-card-content *ngIf="isExpanded[i]">
    <div>
      <app-dcc-localised-string [isRequired]="true" [placeholder]="'dcc.name' | translate"
                                [strings]="item.name!"></app-dcc-localised-string>
      <div class="dcc-row">
        <div class="label-container">
          <label for="norm">Norm<span class="asterix">*</span></label>
        </div>
        <mat-form-field appearance="fill">
          <input [(ngModel)]=item.norms![0] id="norm" matInput name="norm" required>
        </mat-form-field>
      </div>
    </div>
    <button (click)="list.splice(i, 1);isExpanded.splice(i,1)" class="custom-circle-button-md" color="accent"
            mat-icon-button>
      <mat-icon>remove_circle</mat-icon>
    </button>
  </mat-card-content>
</mat-card>
<button (click)="addEmptyMethodDto();addExpanded()" class="custom-circle-button-md" color="primary"
        mat-icon-button>
  <mat-icon>add_circle</mat-icon>
</button>
