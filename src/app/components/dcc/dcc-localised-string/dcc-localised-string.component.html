<div *ngFor="let item of strings.content; let i = index" class="row">
  <ng-container *ngIf="getOrSetLang(item)">
    <div class="label-container">
      <label [for]="placeholder.toLowerCase()">{{placeholder}}<span class="asterix">*</span>
      </label>
      <mat-form-field appearance="outline" class="mat-form-field-flag">
        <mat-select (selectionChange)="updateLanguageMap(item)" [(ngModel)]="item.lang" class="mat-select-flag"
                    mat-icon-button panelClass="custom-dropdown-panel" required>
          <mat-select-trigger class="mat-select-trigger">
            <span class="{{ languageMap.get(item.lang || '')?.icon || 'fi fi-gb' }} icon-flag"></span>
          </mat-select-trigger>
          <mat-option *ngFor="let lang of locales" [value]="lang.lang">
            <span class="{{ lang.icon }}"></span>&nbsp;&nbsp;&nbsp;{{ lang.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <mat-form-field appearance="fill" id="localised-string">
      <input *ngIf="placeholder.toLocaleLowerCase()==='name'" [(ngModel)]="item.text" [id]="placeholder.toLowerCase()"
             [required]=" isRequired " matInput name="item"/>
      <textarea *ngIf="placeholder.toLocaleLowerCase()==='inhalt'" [(ngModel)]="item.text"
                [id]="placeholder.toLowerCase()"
                [required]="isRequired" class="localise-textarea" matInput rows="4">
      </textarea>
    </mat-form-field>
    <div class="button-container">
      <button (click)="strings.content?.push( getEmptyStringWithLangText())" class="custom-circle-button-sm"
              color="primary" mat-icon-button>
        <mat-icon>add_circle</mat-icon>
      </button>
      <button (click)=" strings.content?.splice(i, 1)" [disabled]="strings.content?.length! < 2"
              class="custom-circle-button-sm" color="accent" mat-icon-button>
        <mat-icon>remove_circle</mat-icon>
      </button>
    </div>
  </ng-container>
</div>
