<app-dcc-localised-string [placeholder]="'dcc.name' | translate" [strings]="byteData.name!"
                          required></app-dcc-localised-string>
<mat-form-field>
  <mat-label>{{'dcc.fileName' | translate}}</mat-label>
  <input [(ngModel)]=byteData.fileName matInput placeholder="Dateiname">
</mat-form-field>
<mat-form-field>
  <mat-label>{{'dcc.mimeType' | translate}}</mat-label>
  <input [(ngModel)]=byteData.mimeType matInput placeholder="MIME-Typ">
</mat-form-field>
