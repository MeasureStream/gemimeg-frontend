<div>
  <div>
    <button [matMenuTriggerFor]="menu" class="menu-btn" color="accent" mat-flat-button><span>Daten
        hinzufügen</span><i class="material-icons">arrow_drop_down</i></button>
    <mat-menu #menu="matMenu">
      <button (click)="addObject(option)" *ngFor="let option of options" mat-menu-item>{{option}}</button>

    </mat-menu>
  </div>
</div>

<mat-card *ngFor="let type of dataTypes;let i=index" class="blue-card">

  <mat-card-header>
    <div class="header-title">
      <h4 class="title">
        <ng-container *ngIf="type.byteData">ByteData</ng-container>
        <ng-container *ngIf="type.formula">Formel</ng-container>
        <ng-container *ngIf="type.richContent">RichContent</ng-container>
        <ng-container *ngIf="type.quantity">Quantity</ng-container>
        <ng-container *ngIf="type.list">Liste</ng-container>
      </h4>
    </div>
    <div class="header-menu">
      <button (click)="deleteObject(i)" class="blue-card-btn" mat-icon-button>
        <mat-icon><i class="material-icons">delete</i></mat-icon>
      </button>
      <button (click)="toggleCard(i)" class="blue-card-btn" mat-icon-button><i class="material-icons">{{isExpanded[i]?'keyboard_arrow_up'
        :'keyboard_arrow_down'}}</i></button>
    </div>
  </mat-card-header>
  <mat-card-content *ngIf="isExpanded[i]">
    <div>
      <ng-container *ngIf="type">
        <!-- <app-dcc-richcontent *ngIf="type.richContent" [richContent]="{}"></app-dcc-richcontent>
        <app-mathml *ngIf="type.formula"></app-mathml>
        <app-dcc-byte-data *ngIf="type.byteData"></app-dcc-byte-data> -->
        <div *ngIf="type.formula"><i class="material-icons">construction</i></div>
        <div *ngIf="type.byteData"><i class="material-icons">construction</i></div>
        <div *ngIf="type.richContent"><i class="material-icons">construction</i></div>
        <div *ngIf="type.quantity"><i class="material-icons">construction</i></div>
        <div *ngIf="type.list"><i class="material-icons">construction</i></div>

        <!-- TODO: Include objects if they are present and functional -->
        <!--
        <app-mathml *ngIf="type.formula"></app-mathml>
        <app-dcc-byte-data [byteData]=type.byteData *ngIf="type.byteData"></app-dcc-byte-data>
        <app-dcc-richcontent *ngIf="type.richContent" [richContent]="{}"></app-dcc-richcontent>
        -->

      </ng-container>
    </div>
  </mat-card-content>
</mat-card>
