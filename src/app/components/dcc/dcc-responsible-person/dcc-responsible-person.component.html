<mat-card *ngFor="let respPers of list; let i = index" class="blue-card">
  <mat-card-header>
    <div class="header-title">
      <mat-card-title class="title">Verantwortliche Person {{i+1}}</mat-card-title>
    </div>
    <div class="header-menu">
      <button (click)="toggleCard(i)" class="blue-card-btn" mat-icon-button>
        <mat-icon>
          <i class="material-icons">{{isExpanded[i]?'keyboard_arrow_up':'keyboard_arrow_down'}}</i></mat-icon>
      </button>
    </div>
  </mat-card-header>
  <mat-card-content *ngIf=" isExpanded[i]">

    <app-dcc-localised-string [isRequired]="true" [placeholder]="'Name'"
      [strings]="respPers.name!"></app-dcc-localised-string>

    <!-- Wenn das Objekt location bearbeitet wird, dann durch das ersetzen -->
    <!-- <app-dcc-contact [contact]="respPers"></app-dcc-contact> -->

    <div class="row">
      <div class="label-container">
        <label for="emailAddress">E-Mail</label>
      </div>
      <mat-form-field appearance="fill">
        <input [(ngModel)]="respPers.emailAddress" matInput id="emailAddress" name="emailAddress" />
      </mat-form-field>
    </div>
    <div class="row">
      <div class="label-container">
        <label for="phoneNumber">Telefon</label>
      </div>
      <mat-form-field appearance="fill">
        <input [(ngModel)]="respPers.phoneNumber" matInput id="phoneNumber" name="phoneNumber" />
      </mat-form-field>
    </div>
    <button class="custom-circle-button-md" (click)="list!.splice(i, 1)" *ngIf="list!.length > 1" color="accent"
      mat-icon-button>
      <mat-icon>remove_circle</mat-icon>
    </button>
  </mat-card-content>
</mat-card>
<button class="custom-circle-button-md" (click)="list!.push(getEmptyRespPersonDto());addExpanded()" color="primary"
  mat-icon-button>
  <mat-icon>add_circle</mat-icon>
</button>
