<mat-card>
  <mat-list>
    <mat-list-item *ngFor="let item of list; let i = index">
      <p matLine>
        <app-dcc-localised-string [isRequired]="true" [placeholder]="'Name'"
                                  [strings]="item.name!"></app-dcc-localised-string>

        <mat-icon *ngIf="item.description"
                  matTooltip="An diesem Element hängt ein weiteres Objekt vom Typ Rich Content, dass aber aktuell in diesem Frontend weder bearbeitet noch angezeigt werden kann. Es bleibt aber bei der Erzeugung des DCC erhalten.">
          question_mark
        </mat-icon>
      </p>
      <!-- <app-dcc-data [dataType]="item.data![0]"></app-dcc-data> -->
      <button (click)="list.splice(i, 1)" mat-icon-button>
        <mat-icon>remove</mat-icon>
      </button>
    </mat-list-item>
  </mat-list>
</mat-card>
<p matLine>
  <button (click)="list.push(getEmptyResultDto())" color="accent" mat-icon-button>
    <mat-icon>add</mat-icon>
  </button>
</p>
