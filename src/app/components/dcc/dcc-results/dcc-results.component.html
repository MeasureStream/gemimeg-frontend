<div *ngFor="let item of list; let i = index">
  <mat-card *ngFor="let quantity of item.data; let in = index" class="blue-card">
    <mat-card-header>
      <div class="header-title">
        <mat-card-title class="title">{{ "dcc.result" | translate }} {{ in + 1 }}</mat-card-title>
      </div>
      <div class="header-menu">
        <button (click)="toggleCard(in)" class="blue-card-btn" mat-icon-button>
          <mat-icon>
            <i class="material-icons">{{ isExpanded[in] ? "keyboard_arrow_up" : "keyboard_arrow_down" }}</i></mat-icon
          >
        </button>
      </div>
    </mat-card-header>
    <mat-card-content *ngIf="isExpanded[in]">
      <div>
        <app-dcc-localised-string
          [placeholder]="'dcc.name' | translate"
          [strings]="item.name!"
        ></app-dcc-localised-string>
        <div class="dcc-row">
          <div class="label-container">
            <label for="status">{{ "dcc.status" | translate }}</label>
          </div>
          <mat-form-field appearance="fill">
            <mat-select [(value)]="item.status" id="status" required>
              <mat-option *ngFor="let entry of validRestrictions" [value]="entry">
                {{ entry }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="dcc-row">
          <div class="label-container">
            <label for="refType">{{ "dcc.refType" | translate }}</label>
          </div>
          <mat-form-field appearance="fill" class="full-width">
            <input [(ngModel)]="item.refTypes" id="refType" matInput name="refType" />
          </mat-form-field>
        </div>

        <app-dcc-quantity [i]="i" [item]="item"></app-dcc-quantity>
      </div>
    </mat-card-content>
    <button
      (click)="deleteQuantity(item.data[0]?.list?.quantities, in)"
      class="custom-circle-button-md"
      color="accent"
      mat-icon-button
      type="button"
    >
      <mat-icon>remove_circle</mat-icon>
    </button>
  </mat-card>
  <button
    (click)="item.data[0]?.list?.quantities.push(getEmptyResultDto())"
    class="custom-circle-button-md"
    color="primary"
    mat-icon-button
    type="button"
  >
    <mat-icon>add_circle</mat-icon>
  </button>
</div>
