<mat-card *ngFor="let item of list; let i = index" class="blue-card">
  <mat-card-header>
    <div class="header-title">
      <mat-card-title class="title">{{'dcc.influenceFactor' | translate}} {{i+1}}</mat-card-title>
    </div>
    <div class="header-menu">
      <button (click)="toggleCard(i)" class="blue-card-btn" mat-icon-button>
        <mat-icon>
          <i class="material-icons">{{isExpanded[i]?'keyboard_arrow_up':'keyboard_arrow_down'}}</i>
        </mat-icon>
      </button>
    </div>
  </mat-card-header>
  <mat-card-content *ngIf="isExpanded[i]">
    <app-dcc-localised-string [isRequired]="true" [placeholder]="'dcc.name' | translate"
                              [strings]="item.name!"></app-dcc-localised-string>
    <div class="row">
      <div class="label-container">
        <label for="status">{{'dcc.status' | translate}}</label>
      </div>
      <mat-form-field appearance="fill">
        <mat-select [(value)]="item.status" id="status" required>
          <mat-option *ngFor="let entry of validRestrictions" [value]="entry">
            {{ entry }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div *ngIf="item.description">
      <app-dcc-richcontent richContent="item.description"></app-dcc-richcontent>
    </div>
    <div *ngIf="item.data != null && item.data.length > 0">
      <app-dcc-quantity *ngIf="isQuantity(item.data[0])" [dataType]="item.data[0]"></app-dcc-quantity>
    </div>
    <mat-divider></mat-divider>
    <button (click)="list.splice(i, 1)" class="custom-circle-button-md" color="accent" mat-icon-button>
      <mat-icon>remove_circle</mat-icon>
    </button>
  </mat-card-content>
</mat-card>
<mat-divider></mat-divider>
<button (click)="this.addEmptyConditionDto();addExpanded()" class="custom-circle-button-md" color="primary"
        mat-icon-button>
  <mat-icon>add_circle</mat-icon>
</button>
